<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b2220"><meta name="apple-mobile-web-app-capable" content="yes"><title>Qazaq Lab — мой разговорник</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#eaf7ef;background:#081a18}*{box-sizing:border-box}body{margin:0}header{background:#102a26;padding:28px 20px 22px;border-bottom:1px solid #2b5047}main{max-width:760px;margin:auto;padding:18px}h1{font-size:29px;margin:0 0 5px}p{color:#a6bdb6;margin:5px 0 18px}.controls{display:flex;gap:9px;flex-wrap:wrap}input,select,button{font:inherit;border-radius:12px;padding:13px;border:1px solid #375b52;background:#17342f;color:#fff}input{flex:1;min-width:180px}button{cursor:pointer}button.active{background:#b4e2bc;color:#10241b}#stats{margin:18px 2px;color:#aac4b8;font-size:14px}.item{background:#122b27;border:1px solid #285047;border-radius:17px;margin:11px 0;padding:17px}.ru{color:#a9c0b8;font-size:14px;margin-bottom:8px}.kz{font-size:20px;font-weight:650;line-height:1.45}.meta{display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:8px}.tag{font-size:12px;color:#9bb6a8}.actions{display:flex;gap:7px}.actions button{padding:7px 11px;font-size:15px}details{margin-top:20px;padding:15px;background:#102a26;border-radius:14px}details input{width:100%;margin:5px 0}small{color:#aac4b8}.empty{padding:25px;text-align:center;color:#a8c3b5}</style></head><body><header><div style="max-width:760px;margin:auto"><h1>Qazaq Lab 🇰🇿</h1><p>Мой казахский — реальные фразы на каждый день</p><div class="controls"><input id="search" placeholder="Поиск по-русски или қазақша…"><select id="category"><option value="">Все ситуации</option></select><button id="favFilter">☆ Избранное</button></div></div></header><main><div id="stats"></div><div id="cards"></div><details><summary>＋ Добавить свою фразу</summary><p><small>Сохраняется на этом устройстве. Для переноса используй экспорт.</small></p><input id="ru" placeholder="По-русски"><input id="kz" placeholder="Қазақша"><input id="cat" placeholder="Ситуация, например Работа"><button id="add">Добавить</button></details><div style="margin:22px 0"><button id="export">Экспортировать словарь JSON</button></div></main><script>const seed=[["Привет!","Сәлем!","Общение"],["Здравствуйте!","Сәлеметсіз бе!","Общение"],["Доброе утро!","Қайырлы таң!","Общение"],["Добрый день!","Қайырлы күн!","Общение"],["Добрый вечер!","Қайырлы кеш!","Общение"],["Спокойной ночи!","Қайырлы түн!","Общение"],["Как вы?","Қалайсыз?","Общение"],["У меня всё хорошо, слава Богу.","Менде бәрі жақсы, шүкір.","Общение"],["А вы?","Өзіңіз ше?","Общение"],["До встречи!","Кездескенше!","Общение"],["Хорошего дня!","Күніңіз жақсы өтсін!","Общение"],["Хорошо отдохнули?","Жақсы демалдыңыз ба?","Общение"],["Я дома.","Үйдемін.","Быт"],["Я работаю дома.","Үйде жұмыс істеп жатырмын.","Работа"],["Я сейчас работаю.","Қазір жұмыс істеп жатырмын.","Работа"],["Мы сейчас на созвоне.","Біз қазір онлайн кездесудеміз.","Работа"],["Готовлюсь к встрече.","Кездесуге дайындалып жатырмын.","Работа"],["Я продолжу работу.","Жұмысымды жалғастырамын.","Работа"],["Когда можем созвониться?","Қашан сөйлесе аламыз?","Работа"],["Можете завтра?","Ертең сөйлесе аласыз ба?","Работа"],["Я отправил Аяулым.","Мен Аяулымға жібердім.","Работа"],["Я отправлю Аяулым.","Мен Аяулымға жіберемін.","Работа"],["Сегодня выйдет новое видео.","Бүгін жаңа видео шығады.","Работа"],["Я учу казахский.","Мен қазақ тілін үйреніп жүрмін.","Учёба"],["Я буду на уроке.","Сабақта боламын.","Учёба"],["Да, я помню.","Иә, есімде.","Учёба"],["Я не понимаю по-русски.","Мен орысша түсінбеймін.","Учёба"],["Я не работал.","Мен жұмыс істемедім.","Учёба"],["Я не работаю.","Мен жұмыс істемеймін.","Учёба"],["Я никогда не играю в футбол.","Мен ешқашан футбол ойнамаймын.","Учёба"],["Я никогда не смотрю телевизор.","Мен ешқашан теледидар көрмеймін.","Учёба"],["Обними меня.","Мені құшақташы.","Семья"],["Помоги мне, пожалуйста.","Маған көмектесші.","Семья"],["Закрой дверь.","Есікті жап.","Семья"],["Пойдём кушать!","Жүр, тамақ ішеміз!","Еда"],["Завтрак готов.","Таңғы ас дайын.","Еда"],["Сейчас приготовлю завтрак.","Қазір таңғы ас дайындаймын.","Еда"],["Я вчера приготовил плов.","Кеше палау пісірдім.","Еда"],["Я сегодня ел яйца на завтрак.","Мен бүгін таңғы асқа жұмыртқа жедім.","Еда"],["Я только что сходил в магазин.","Мен жаңа ғана дүкенге барып келдім.","Быт"],["Я купил масло.","Май сатып алдым.","Быт"],["Я уберу свою комнату.","Мен бөлмемді жинаймын.","Быт"],["Сейчас иду к другу.","Қазір досыма бара жатырмын.","Планы"],["Я ещё не решил.","Әлі шешкен жоқпын.","Планы"],["Может, пойду.","Бәлкім, барамын.","Планы"],["Я хочу записаться на встречу.","Кездесуге жазылғым келеді.","Мероприятия"],["Нас будет двое.","Екеуміз барамыз.","Мероприятия"],["Я оплатил.","Төлем жасадым.","Мероприятия"],["Оплата поступила.","Төлем түсті.","Мероприятия"],["Спасибо за видео!","Видео үшін рақмет!","Общение"],["Такие новости!","Осындай жаңалықтар!","Общение"],["Меня зовут Руслан.","Менің атым — Руслан.","Знакомство"],["Я маркетолог школы Qazline.","Мен Qazline қазақ тілі мектебінің маркетологымын.","Знакомство"],["Мне нравятся комедии.","Маған комедиялар ұнайды.","Знакомство"],["Я проснулся в 6:20.","Мен таңғы сағат алты жиырмада ояндым.","Быт"],["Сегодня я отдыхал.","Бүгін демалдым.","Быт"],["Хочу записаться на субботу.","Осы сенбі күні жазылғым келеді.","Мероприятия"],["Спасибо!","Рақмет!","Общение"]];const $=id=>document.getElementById(id);let extra=JSON.parse(localStorage.getItem('qazaq-extra')||'[]'),fav=JSON.parse(localStorage.getItem('qazaq-fav')||'[]'),onlyFav=false;function all(){return [...seed,...extra]}function render(){let arr=all(),categories=[...new Set(arr.map(x=>x[2]))].sort(),current=$('category').value;$('category').innerHTML='<option value="">Все ситуации</option>'+categories.map(c=>'<option>'+escapeHTML(c)+'</option>').join('');$('category').value=current;let q=$('search').value.toLowerCase().trim(),filtered=arr.map((x,i)=>({x,i})).filter(({x,i})=>(!current||x[2]===current)&&(!q||x.join(' ').toLowerCase().includes(q))&&(!onlyFav||fav.includes(x[0]+'|'+x[1])));$('stats').textContent=filtered.length+' фраз из '+arr.length+' · '+categories.length+' ситуаций';$('cards').innerHTML=filtered.length?filtered.map(({x,i})=>{let key=x[0]+'|'+x[1],saved=fav.includes(key);return '<article class="item"><div class="ru">'+escapeHTML(x[0])+'</div><div class="kz">'+escapeHTML(x[1])+'</div><div class="meta"><span class="tag">'+escapeHTML(x[2])+'</span><div class="actions"><button data-speak="'+i+'" aria-label="Произнести">🔊</button><button data-copy="'+i+'" aria-label="Копировать">⧉</button><button data-fav="'+i+'" aria-label="Избранное">'+(saved?'★':'☆')+'</button></div></div></article>'}).join(''):'<div class="empty">Ничего не найдено</div>'}function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;let a=all(),i=b.dataset.speak??b.dataset.copy??b.dataset.fav;if(i===undefined)return;let x=a[Number(i)];if(b.dataset.speak!==undefined){if(!('speechSynthesis'in window))return alert('Озвучивание недоступно');speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(x[1]);u.lang='kk-KZ';u.rate=.82;speechSynthesis.speak(u)}if(b.dataset.copy!==undefined)navigator.clipboard?.writeText(x[1]);if(b.dataset.fav!==undefined){let key=x[0]+'|'+x[1];fav=fav.includes(key)?fav.filter(z=>z!==key):[...fav,key];localStorage.setItem('qazaq-fav',JSON.stringify(fav));render()}});$('search').oninput=render;$('category').onchange=render;$('favFilter').onclick=()=>{onlyFav=!onlyFav;$('favFilter').classList.toggle('active',onlyFav);render()};$('add').onclick=()=>{let x=[$('ru').value.trim(),$('kz').value.trim(),$('cat').value.trim()||'Мои фразы'];if(!x[0]||!x[1])return alert('Заполни оба языка');extra.push(x);localStorage.setItem('qazaq-extra',JSON.stringify(extra));['ru','kz','cat'].forEach(id=>$(id).value='');render()};$('export').onclick=()=>{let blob=new Blob([JSON.stringify({phrases:all(),favorites:fav},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='qazaq-dictionary.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};render();</script></body></html>
